name: Manus wording closure

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-wording:
    if: github.event.pull_request.number == 440 && github.event.pull_request.head.ref == 'agent/crystal-freeze-closure-2026-08-19'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/crystal-freeze-closure-2026-08-19
          fetch-depth: 0
      - name: Reconcile pipeline telemetry comments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('core/pipeline.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'adaptation.record_block()   # stress → verification rises (RFC0071)':
                  'adaptation.record_block()   # high-stress telemetry; default TruthGate policy stays fixed',
              'adaptation.record_success()     # a healthy outcome → the threshold relaxes':
                  'adaptation.record_success()     # low-stress telemetry; verification tag is unchanged',
              'adaptation.record_block()       # stress → verification rises (RFC0071)':
                  'adaptation.record_block()       # high-stress telemetry; default TruthGate policy stays fixed',
          }
          for old, new in replacements.items():
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one anchor: {old!r}; found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -F 'default TruthGate policy stays fixed' core/pipeline.py
          grep -F 'verification tag is unchanged' core/pipeline.py
      - name: Commit wording-only change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/pipeline.py
          if git diff --cached --quiet; then
            echo "No wording changes required"
            exit 0
          fi
          git commit -m "docs(freeze): reconcile pipeline adaptation wording"
          git push origin HEAD:agent/crystal-freeze-closure-2026-08-19
