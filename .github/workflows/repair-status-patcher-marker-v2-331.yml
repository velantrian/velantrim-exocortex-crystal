name: Repair bounded migration status patcher v2

on:
  push:
    branches:
      - agent/bounded-migration-status-331
    paths:
      - .github/workflows/repair-status-patcher-marker-v2-331.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-migration-status-331
          fetch-depth: 0
      - name: Repair anchor and remove repair workflows
        run: |
          python -c 'from pathlib import Path; p=Path("scripts/apply_bounded_migration_status_331.py"); t=p.read_text(); old="insert = work.index(\"Add new entries at the top\")\ninsert = work.index(\"\\n\", insert) + 1"; new="insert = work.index(\"\\n## \") + 1"; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          rm .github/workflows/repair-status-patcher-marker-331.yml
          rm .github/workflows/repair-status-patcher-marker-v2-331.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(docs): anchor bounded migration work log entry"
          git push origin HEAD:agent/bounded-migration-status-331
