name: Pre-Freeze Corrective Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/crystal-pre-freeze-remediation-2026-08-18

permissions:
  contents: write

jobs:
  corrective:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/crystal-pre-freeze-remediation-2026-08-18
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          pip install ruff==0.15.21
      - name: Apply corrective patch
        run: python tools/pre_freeze_corrective_patch.py
      - name: Ruff changed production/tooling files
        run: ruff check core/evidence.py core/reconcile.py core/trace.py core/storage_migration.py core/eval.py tools/pre_freeze_corrective_patch.py
      - name: Targeted corrective tests
        run: |
          pytest -q \
            tests/test_pre_freeze_wave1.py \
            tests/test_pre_freeze_wave2.py \
            tests/test_pre_freeze_wave3.py \
            tests/test_pre_freeze_wave4.py \
            tests/test_pre_freeze_closure.py \
            tests/test_bounded_legacy_retrieval.py::test_bounded_no_hit_still_reports_degraded_work
      - name: Commit corrective delta
        run: |
          git config user.name 'Velantrim CI'
          git config user.email 'actions@users.noreply.github.com'
          git add core tests docs/grant/CRYSTAL_PRE_FREEZE_EVIDENCE.md
          if git diff --cached --quiet; then
            echo 'No corrective delta to commit'
            exit 1
          fi
          git commit -m 'fix(pre-freeze): close corrective audit findings'
          git push origin HEAD:agent/crystal-pre-freeze-remediation-2026-08-18
