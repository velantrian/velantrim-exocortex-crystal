name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:


jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.15.21
      - name: Lint production and tooling code
        run: ruff check core scripts prototypes utils *.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install package
        run: pip install -e .
      - name: Run tests with coverage gate (100%, same as pyproject addopts)
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ --cov=. --cov-fail-under=100 2>&1 \
            | tee pytest-${{ matrix.python-version }}.log
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-log
          path: pytest-${{ matrix.python-version }}.log

  jsonl-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSONL integrity (parse + schema + duplicate ids)
        run: |
          python -c "
          import json, sys

          # Fields every chunk must carry. 'layer' is intentionally excluded:
          # the document header chunk (idx 0) belongs to no memory layer.
          REQUIRED_FIELDS = ['chunk_id', 'title', 'content']
          path = 'docs/archive/Velantrim_V8_Crystal_Sprint1.jsonl'
          errors = []
          ids_seen = {}

          with open(path) as f:
              for i, line in enumerate(f, 1):
                  if not line.strip():
                      continue
                  try:
                      obj = json.loads(line)
                  except json.JSONDecodeError as e:
                      errors.append(f'Line {i}: JSON parse error: {e}')
                      continue

                  # Required field presence
                  for field in REQUIRED_FIELDS:
                      if not obj.get(field):
                          errors.append(f'Line {i}: missing required field \"{field}\" in chunk {obj.get(\"chunk_id\", \"?\")}')

                  # Duplicate chunk_id detection
                  cid = obj.get('chunk_id')
                  if cid:
                      if cid in ids_seen:
                          errors.append(f'Line {i}: duplicate chunk_id \"{cid}\" (first at line {ids_seen[cid]})')
                      else:
                          ids_seen[cid] = i

          if errors:
              print('❌ JSONL validation failed:')
              for e in errors:
                  print(' ', e)
              sys.exit(1)
          print(f'✅ JSONL integrity OK ({len(ids_seen)} chunks, no duplicates, all required fields present)')
          "

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Evaluation quality gate (WP3)
        run: python scripts/eval_gate.py --out-dir eval-artifacts
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-artifacts/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks compares the PR head with its parent commit; a shallow
          # checkout contains only the synthetic merge ref and makes that
          # revision range unavailable.
          fetch-depth: 0
      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
      - name: Python security lint (bandit)
        run: |
          bandit -r core/ scripts/ -ll -q
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install -r requirements-dev.txt
          pip-audit --ignore-vuln PYSEC-2022-42969

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened runtime image
        run: docker build --tag velantrim-ci .
