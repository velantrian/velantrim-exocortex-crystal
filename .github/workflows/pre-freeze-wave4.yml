name: Crystal Pre-Freeze Wave 4

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/pre_freeze_wave4_patch.py
      - .github/workflows/pre-freeze-wave4.yml

permissions:
  contents: write

jobs:
  apply-test-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Apply Wave 4 patch
        run: python tools/pre_freeze_wave4_patch.py
      - name: Compile freeze surfaces
        run: python -m compileall -q core scripts tests/test_pre_freeze_wave4.py
      - name: Run focused freeze regressions
        run: |
          pytest -q -o addopts='' \
            tests/test_pre_freeze_wave1.py \
            tests/test_pre_freeze_wave2.py \
            tests/test_pre_freeze_wave3.py \
            tests/test_pre_freeze_wave4.py \
            tests/test_concept.py \
            tests/test_eval.py
      - name: Run shipping evaluation gate
        env:
          VELANTRIM_EMBEDDER: hashing
          VELANTRIM_EMBEDDER_STRICT: "1"
        run: python scripts/eval_gate.py --out-dir /tmp/crystal-eval
      - name: Commit validated Wave 4 changes
        run: |
          git config user.name "velantrim-pre-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            core/concept.py \
            core/eval.py \
            scripts/eval_gate.py \
            core/_eval_fixtures/manifest.json \
            tests/test_pre_freeze_wave4.py \
            docs/grant/CRYSTAL_PRE_FREEZE_EVIDENCE.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix(pre-freeze): close freeze gates and harden shipping eval"
          git push origin HEAD:agent/crystal-pre-freeze-remediation-2026-08-18
