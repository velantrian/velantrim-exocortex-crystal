name: Crystal Pre-Freeze Wave 4

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/pre_freeze_wave4_patch.py
      - .github/workflows/pre-freeze-wave4.yml

permissions:
  contents: write

jobs:
  apply-test-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Repair staging script and apply Wave 4 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/pre_freeze_wave4_patch.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def write_fixture_manifest() -> None:")
          end = text.index("\n\ndef write_wave4_tests()", start)
          fixed = '''def write_fixture_manifest() -> None:
              fixture_dir = ROOT / "core" / "_eval_fixtures"
              names = sorted(
                  path.name for path in fixture_dir.glob("*.json")
                  if path.name != "manifest.json"
              )
              manifest = {
                  "version": 1,
                  "algorithm": "sha256",
                  "sha256": {
                      name: hashlib.sha256((fixture_dir / name).read_bytes()).hexdigest()
                      for name in names
                  },
              }
              (fixture_dir / "manifest.json").write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\\n",
                  encoding="utf-8",
              )
          '''
          path.write_text(text[:start] + fixed + text[end:], encoding="utf-8")
          PY
          python tools/pre_freeze_wave4_patch.py
      - name: Correct restricted concept test fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_pre_freeze_wave4.py")
          text = path.read_text(encoding="utf-8")
          old = '''    fact = get_fact(fid)
              get_l3_graph().merge_fact(fact)
              return fact
          '''
          new = '''    fact = get_fact(fid)
              node = dict(fact)
              node["restricted"] = restricted
              get_l3_graph().merge_fact(node)
              return fact
          '''
          if old not in text:
              raise SystemExit("restricted fixture anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Synchronize TRACE v2 JSON schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("schemas/trace.schema.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          item = data["$defs"]["trace_item"]
          item["required"] = [
              "trace_version", "fact_id", "source", "origin", "epistemic_state",
              "retrieval_rank", "retrieval_score", "retrieval_signals", "retrieved_at",
          ]
          props = item["properties"]
          props.pop("confidence", None)
          props["trace_version"] = {"type": "integer", "const": 2}
          props["retrieval_rank"] = {"type": "integer", "minimum": 1}
          props["retrieval_score"] = {
              "type": "number",
              "description": "Query-local retrieval relevance score; never epistemic confidence",
          }
          props["retrieval_signals"] = {
              "type": "array",
              "items": {"type": "string"},
              "description": "Query-local mechanisms that contributed to retrieval ordering",
          }
          props["active_embedder_id"] = {"type": ["string", "null"]}
          props["stored_embedder_id"] = {"type": ["string", "null"]}
          props["retrieval_mode"] = {"type": ["string", "null"]}
          props["retrieval_config_id"] = {"type": ["string", "null"]}
          props["projection_id"] = {"type": ["string", "null"]}
          props["graph_explanation"] = {
              "type": "object",
              "description": "Bounded heuristic activation explanation; not evidence or proof",
              "additionalProperties": True,
          }
          evidence = data["$defs"]["evidence_span"]["properties"]
          evidence["lineage_id"] = {"type": ["string", "null"]}
          evidence["independence_class"] = {
              "type": "string",
              "enum": ["UNKNOWN", "SAME_LINEAGE", "INDEPENDENT_ASSERTED"],
          }
          evidence["lineage_basis"] = {
              "type": "string",
              "enum": ["UNKNOWN", "CURATOR_ASSERTED", "PUBLISHER_DECLARED", "IMPORTER_DECLARED"],
          }
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Compile freeze surfaces
        run: python -m compileall -q core scripts tests/test_pre_freeze_wave4.py
      - name: Run focused freeze regressions
        run: |
          pytest -q -o addopts='' \
            tests/test_pre_freeze_wave1.py \
            tests/test_pre_freeze_wave2.py \
            tests/test_pre_freeze_wave3.py \
            tests/test_pre_freeze_wave4.py \
            tests/test_concept.py \
            tests/test_eval.py \
            tests/test_trace.py
      - name: Run shipping evaluation gate
        env:
          VELANTRIM_EMBEDDER: hashing
          VELANTRIM_EMBEDDER_STRICT: "1"
        run: python scripts/eval_gate.py --out-dir /tmp/crystal-eval
      - name: Commit validated Wave 4 changes
        run: |
          git config user.name "velantrim-pre-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            core/concept.py \
            core/eval.py \
            scripts/eval_gate.py \
            schemas/trace.schema.json \
            core/_eval_fixtures/manifest.json \
            tests/test_pre_freeze_wave4.py \
            docs/grant/CRYSTAL_PRE_FREEZE_EVIDENCE.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix(pre-freeze): close freeze gates and harden shipping eval"
          git push origin HEAD:agent/crystal-pre-freeze-remediation-2026-08-18
