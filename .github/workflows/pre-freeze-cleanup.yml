name: Crystal Pre-Freeze Cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pre-freeze-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Pin implementation candidate and remove staging machinery
        run: |
          implementation_sha="$(git rev-parse HEAD)"
          python - "$implementation_sha" <<'PY'
          from pathlib import Path
          import sys
          sha = sys.argv[1]
          path = Path("docs/grant/CRYSTAL_PRE_FREEZE_EVIDENCE.md")
          text = path.read_text(encoding="utf-8")
          marker = "Status: **freeze candidate; not production authorization**.\n"
          addition = f"\nImplementation candidate SHA: `{sha}`\n"
          if "Implementation candidate SHA:" not in text:
              text = text.replace(marker, marker + addition, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm -f \
            tools/pre_freeze_wave1_patch.py \
            tools/pre_freeze_wave2_patch.py \
            tools/pre_freeze_wave3_patch.py \
            tools/pre_freeze_wave4_patch.py \
            .github/workflows/pre-freeze-wave1.yml \
            .github/workflows/pre-freeze-wave2.yml \
            .github/workflows/pre-freeze-wave3.yml \
            .github/workflows/pre-freeze-wave4.yml \
            .github/workflows/pre-freeze-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "velantrim-pre-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(pre-freeze): remove temporary staging gates"
          git push origin HEAD:agent/crystal-pre-freeze-remediation-2026-08-18
