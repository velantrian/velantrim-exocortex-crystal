name: Optimize migration limit failure test

on:
  push:
    branches:
      - agent/bounded-migration-331
    paths:
      - .github/workflows/optimize-migration-limit-test-331.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-migration-331
          fetch-depth: 0
      - name: Patch test and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_storage_migration_streaming.py")
          text = test_path.read_text()
          needle = "    real_read = m.os.read\n    calls = {\"count\": 0}\n"
          replacement = (
              "    monkeypatch.setattr(m, \"MAX_DATASET_BYTES\", metadata[\"bytes\"])\n\n"
              "    real_read = m.os.read\n"
              "    calls = {\"count\": 0}\n"
          )
          if replacement not in text:
              if text.count(needle) != 1:
                  raise SystemExit("expected one migration limit test marker")
              text = text.replace(needle, replacement, 1)
              test_path.write_text(text)

          Path(".github/workflows/optimize-migration-limit-test-331.yml").unlink()
          PY
      - name: Commit optimized test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_storage_migration_streaming.py \
            .github/workflows/optimize-migration-limit-test-331.yml
          git commit -m "test(storage): avoid large allocation in limit probe"
          git push origin HEAD:agent/bounded-migration-331
