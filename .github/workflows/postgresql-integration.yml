name: PostgreSQL inactive import integration

on:
  pull_request:
    paths:
      - "core/postgresql_migration.py"
      - "core/postgresql_migration_impl.py"
      - "core/storage_ops.py"
      - "tests/postgresql_migration_support.py"
      - "tests/test_postgresql_migration_*.py"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/postgresql-integration.yml"
  push:
    branches: [main]
    paths:
      - "core/postgresql_migration.py"
      - "core/postgresql_migration_impl.py"
      - "core/storage_ops.py"
      - "tests/postgresql_migration_support.py"
      - "tests/test_postgresql_migration_*.py"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/postgresql-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-pgvector-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: crystal
          POSTGRES_DB: crystal
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crystal -d crystal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VELANTRIM_POSTGRES_TEST_DSN: postgresql://crystal@127.0.0.1:5432/crystal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test and optional PostgreSQL dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Run real inactive import and exact equivalence
        run: pytest -q tests/test_postgresql_migration_integration.py --no-cov
