name: Manus localization closure

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-localization-state:
    if: github.event.pull_request.number == 440 && github.event.pull_request.head.ref == 'agent/crystal-freeze-closure-2026-08-19'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/crystal-freeze-closure-2026-08-19
          fetch-depth: 0
      - name: Apply bounded localization freshness state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          SOURCE = "b4be6831a8b9f87cea815b6a0ef2c497a2d5059a"
          ISSUE = 441
          LOCALES = ("ar", "de", "es", "fr", "hi", "it", "ja", "ru", "zh-CN")

          manifest_path = Path("docs/status/implementation-manifest.json")
          manifest_text = manifest_path.read_text(encoding="utf-8")
          if '"truth_gate_v1_localization_reassessment"' not in manifest_text:
              anchor = '    "d1_pending_locales": []\n'
              if manifest_text.count(anchor) != 1:
                  raise SystemExit(f"manifest anchor count={manifest_text.count(anchor)}")
              affected = {
                  locale: [f"docs/{locale}/STATUS.md", f"docs/{locale}/IMPLEMENTATION_STATUS.md"]
                  for locale in LOCALES
              }
              policy = {
                  "state": "REASSESSMENT_REQUIRED",
                  "tracking_issue": ISSUE,
                  "english_source_sha": SOURCE,
                  "material_change": "fixed_versioned_default_truthgate_policy",
                  "affected_documents": affected,
                  "current_markers_are_policy_parity_proof": False,
              }
              block = json.dumps(policy, ensure_ascii=False, indent=6).replace("\n", "\n    ")
              manifest_text = manifest_text.replace(
                  anchor,
                  '    "d1_pending_locales": [],\n'
                  '    "truth_gate_v1_localization_reassessment": ' + block + '\n',
                  1,
              )
              json.loads(manifest_text)
              manifest_path.write_text(manifest_text, encoding="utf-8")

          ledger_path = Path("docs/TRANSLATION_STATUS.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          heading = "### Pending material English policy change — TruthGate v1"
          if heading not in ledger:
              anchor = "No supported Reader-dependent locale pack remains `REFRESH_NEEDED` after Hindi parity.\n"
              if ledger.count(anchor) != 1:
                  raise SystemExit(f"ledger anchor count={ledger.count(anchor)}")
              section = f'''\n### Pending material English policy change — TruthGate v1\n\nEnglish `docs/STATUS.md` and `docs/IMPLEMENTATION_STATUS.md` changed at\n`main@{SOURCE}` to state the fixed, versioned default TruthGate policy\n(`truth-gate-v1-fixed-0.05`) and the separation of adaptation telemetry from\nadmission authority.\n\nThe existing localized D1 `STATUS.md` and `IMPLEMENTATION_STATUS.md` markers\nremain evidence of the earlier post-RRTIC checkpoint only. They are **not proof\nof parity for this policy change**. Reassessment is tracked in Issue #{ISSUE};\naffected files are listed in `docs/status/implementation-manifest.json` under\n`truth_gate_v1_localization_reassessment`.\n'''
              ledger_path.write_text(ledger.replace(anchor, anchor + section, 1), encoding="utf-8")

          validator_path = Path("scripts/check_d1_translation_status.py")
          validator = validator_path.read_text(encoding="utf-8")
          if "TRUTH_GATE_V1_SOURCE" not in validator:
              anchor = 'REFRESH_LOCALES = tuple(locale for locale in LOCALES if locale not in CURRENT_LOCALES)\n'
              constants = f'''TRUTH_GATE_V1_SOURCE = "{SOURCE}"\nTRUTH_GATE_V1_STATE = "REASSESSMENT_REQUIRED"\nTRUTH_GATE_V1_ISSUE = {ISSUE}\nTRUTH_GATE_V1_DOCUMENTS = {{\n    locale: [f"docs/{{locale}}/STATUS.md", f"docs/{{locale}}/IMPLEMENTATION_STATUS.md"]\n    for locale in LOCALES\n}}\n'''
              if validator.count(anchor) != 1:
                  raise SystemExit("validator constants anchor mismatch")
              validator = validator.replace(anchor, anchor + constants, 1)

              anchor = '''    refresh_docs = {\n        locale: [f"docs/{locale}/STATUS.md", f"docs/{locale}/IMPLEMENTATION_STATUS.md"]\n        for locale in REFRESH_LOCALES\n    }\n'''
              policy_check = '''    policy = documentation.get("truth_gate_v1_localization_reassessment")\n    expected_policy = {\n        "state": TRUTH_GATE_V1_STATE,\n        "tracking_issue": TRUTH_GATE_V1_ISSUE,\n        "english_source_sha": TRUTH_GATE_V1_SOURCE,\n        "material_change": "fixed_versioned_default_truthgate_policy",\n        "affected_documents": TRUTH_GATE_V1_DOCUMENTS,\n        "current_markers_are_policy_parity_proof": False,\n    }\n    if policy != expected_policy:\n        errors.append("manifest: invalid TruthGate v1 localization reassessment state")\n'''
              if validator.count(anchor) != 1:
                  raise SystemExit("validator policy anchor mismatch")
              validator = validator.replace(anchor, policy_check + anchor, 1)

              anchor = '''    state = (ROOT / "docs/ai/CURRENT_STATE.md").read_text(encoding="utf-8")\n'''
              ledger_check = '''    for marker in (\n        "Pending material English policy change — TruthGate v1",\n        f"main@{TRUTH_GATE_V1_SOURCE}",\n        f"Issue #{TRUTH_GATE_V1_ISSUE}",\n        "not proof",\n    ):\n        if marker not in ledger:\n            errors.append(\n                f"translation ledger: missing TruthGate v1 reassessment marker {marker!r}"\n            )\n\n'''
              if validator.count(anchor) != 1:
                  raise SystemExit("validator ledger anchor mismatch")
              validator_path.write_text(validator.replace(anchor, ledger_check + anchor, 1), encoding="utf-8")

          status_path = Path("docs/STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          old = "Localized D1 status documents therefore require a separate freshness reassessment before their prior checkpoint can be treated as proof of parity; this PR does not claim that unchanged translations already express the new policy."
          new = old + " The bounded reassessment is tracked by Issue #441."
          if new not in status:
              if status.count(old) != 1:
                  raise SystemExit("STATUS localization anchor mismatch")
              status_path.write_text(status.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate localization status contract
        run: |
          python scripts/check_d1_translation_status.py
          python -m json.tool docs/status/implementation-manifest.json >/dev/null
      - name: Commit bounded status closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status/implementation-manifest.json docs/TRANSLATION_STATUS.md scripts/check_d1_translation_status.py docs/STATUS.md
          if git diff --cached --quiet; then
            echo "No localization status changes required"
            exit 0
          fi
          git commit -m "docs(freeze): track TruthGate v1 localization freshness"
          git push origin HEAD:agent/crystal-freeze-closure-2026-08-19
