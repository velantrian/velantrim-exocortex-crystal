name: Crystal Pre-Freeze Wave 1

on:
  push:
    branches:
      - agent/crystal-pre-freeze-remediation-2026-08-18
    paths:
      - tools/pre_freeze_wave1_patch.py
      - .github/workflows/pre-freeze-wave1.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Apply Wave 1 patch
        run: python tools/pre_freeze_wave1_patch.py
      - name: Compile changed Python surfaces
        run: python -m compileall -q core tests/test_pre_freeze_wave1.py
      - name: Run targeted Wave 1 regressions
        run: |
          pytest -q -o addopts='' \
            tests/test_storage_migration.py::test_safe_rechecks_and_directory_guards \
            tests/test_pre_freeze_wave1.py
      - name: Commit validated Wave 1 changes
        run: |
          git config user.name "velantrim-pre-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            core/storage_migration.py \
            core/retrieval_config.py \
            core/l3_graph.py \
            core/pipeline.py \
            tests/test_pre_freeze_wave1.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix(pre-freeze): harden storage and graph recall"
          git push origin HEAD:agent/crystal-pre-freeze-remediation-2026-08-18
