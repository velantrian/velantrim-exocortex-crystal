name: Crystal Pre-Freeze Wave 3

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/pre_freeze_wave3_patch.py
      - .github/workflows/pre-freeze-wave3.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Apply Wave 3 patch
        run: python tools/pre_freeze_wave3_patch.py
      - name: Compile Wave 3 surfaces
        run: python -m compileall -q core tests/test_pre_freeze_wave3.py
      - name: Run targeted Wave 3 regressions
        run: |
          pytest -q -o addopts='' \
            tests/test_pre_freeze_wave1.py \
            tests/test_pre_freeze_wave2.py \
            tests/test_pre_freeze_wave3.py \
            tests/test_evidence.py \
            tests/test_reconcile.py
      - name: Commit validated Wave 3 changes
        run: |
          git config user.name "velantrim-pre-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            core/memory.py \
            core/evidence.py \
            core/query_pipeline.py \
            core/reconcile.py \
            tests/test_pre_freeze_wave3.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix(pre-freeze): require strict evidence and track lineage"
          git push origin HEAD:agent/crystal-pre-freeze-remediation-2026-08-18
