name: Bounded migration resource evidence

on:
  push:
    branches:
      - agent/bounded-migration-331
    paths:
      - scripts/storage_migration_resource_benchmark.sh
      - .github/workflows/run-storage-migration-benchmark-331.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        records: [1025, 8193]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bounded migration resource probe
        run: |
          bash scripts/storage_migration_resource_benchmark.sh \
            "${{ matrix.records }}" \
            "storage-migration-${{ matrix.records }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: storage-migration-resource-${{ matrix.records }}
          path: storage-migration-${{ matrix.records }}.json
          if-no-files-found: error
