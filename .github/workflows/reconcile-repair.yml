name: One-off Canon reconciliation repair

on:
  push:
    branches: [agent/optimize-sqlite-vector-search]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: add one-off reconciliation repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/optimize-sqlite-vector-search
          fetch-depth: 0

      - name: Apply narrow Canon-to-L1 repair path
        run: |
          python - <<'PY'
          from pathlib import Path

          memory = Path('core/memory.py')
          pipeline = Path('core/pipeline.py')
          ci = Path('.github/workflows/ci.yml')

          m = memory.read_text()
          old = '''# ─── Columns that can be updated individually without changing the ESM state ─────────
          _UPDATABLE = {"claim", "source", "confidence", "significance",
                        "claim_type", "source_status", "metadata"}


          def update_fact(fact_id: str, **fields) -> bool:
          '''
          new = '''# ─── Columns that can be updated individually without changing the ESM state ─────────
          _UPDATABLE = {"claim", "source", "confidence", "significance",
                        "claim_type", "source_status", "metadata"}

          # A Canon/L3 reconciliation occasionally has to repair an L1 row that was just
          # created from an untrusted transient retrieval item before the physical L3 node
          # was loaded. That is not a user-requested claim rewrite: it restores the same
          # fact_id to the already-persisted canonical record. Keep this privilege
          # process-local, thread-local and private so public update_fact()/store_fact()
          # callers cannot opt out of claim-identity protection with a keyword flag.
          _CANON_REPAIR_CONTEXT = threading.local()
          _CANON_REPAIRABLE_FIELDS = {
              "claim", "source", "confidence", "claim_type", "source_status",
          }


          def update_fact(fact_id: str, **fields) -> bool:
          '''
          if old not in m:
              raise SystemExit('memory anchor 1 not found')
          m = m.replace(old, new, 1)

          old = '''    if "claim" in fields:
                  _assert_claim_identity(
                      fact_id,
                      existing.get("claim", ""),
                      fields["claim"],
                      existing.get("epistemic_state", "Observed"),
                  )
          '''
          new = '''    if (
                  "claim" in fields
                  and not getattr(_CANON_REPAIR_CONTEXT, "enabled", False)
              ):
                  _assert_claim_identity(
                      fact_id,
                      existing.get("claim", ""),
                      fields["claim"],
                      existing.get("epistemic_state", "Observed"),
                  )
          '''
          if old not in m:
              raise SystemExit('memory anchor 2 not found')
          m = m.replace(old, new, 1)

          old = '''        _l0_put(fact_id, refreshed)
                  return True


          def transition_esm(fact_id: str, new_state: str) -> bool:
          '''
          new = '''        _l0_put(fact_id, refreshed)
                  return True


          def _repair_fact_from_canon(fact_id: str, **fields) -> bool:
              """Repair L1 from an already-persisted physical L3 record.

              This is the sole internal exception to promoted claim-identity locking. It
              exists for ordinary recall reconciliation after build_facts_pack() created
              or refreshed L1 from a transient retrieval item before the authoritative L3
              node was loaded. Only trust-relevant fields already validated by
              pipeline._reconcile_recalled_fact() are accepted. The privilege is scoped to
              this synchronous call and cannot be requested through the public API.
              """
              canon_fields = {
                  key: value
                  for key, value in fields.items()
                  if key in _CANON_REPAIRABLE_FIELDS
              }
              previous = getattr(_CANON_REPAIR_CONTEXT, "enabled", False)
              _CANON_REPAIR_CONTEXT.enabled = True
              try:
                  return update_fact(fact_id, **canon_fields)
              finally:
                  _CANON_REPAIR_CONTEXT.enabled = previous


          def transition_esm(fact_id: str, new_state: str) -> bool:
          '''
          if old not in m:
              raise SystemExit('memory anchor 3 not found')
          m = m.replace(old, new, 1)
          memory.write_text(m)

          p = pipeline.read_text()
          old = '''from core.memory import (
              store_fact, get_fact, update_fact, transition_esm, ESM_TRANSITIONS,
              l3_secondary_sync_admissible, DEFAULT_SOURCE_STATUS,
              CLAIM_TYPES, SOURCE_STATUSES,
          )
          '''
          new = '''from core.memory import (
              store_fact, get_fact, update_fact, _repair_fact_from_canon,
              transition_esm, ESM_TRANSITIONS, l3_secondary_sync_admissible,
              DEFAULT_SOURCE_STATUS, CLAIM_TYPES, SOURCE_STATUSES,
          )
          '''
          if old not in p:
              raise SystemExit('pipeline import anchor not found')
          p = p.replace(old, new, 1)

          old = '''    if resync_fields:
                  update_fact(fact["fact_id"], **resync_fields)
          '''
          new = '''    if resync_fields:
                  # Public update_fact() correctly rejects promoted claim rewrites. This
                  # narrow private path is different: L3 is already the physical
                  # canonical record for this fact_id, and the write only repairs the L1
                  # copy created/refreshed from an untrusted transient retrieval item.
                  _repair_fact_from_canon(fact["fact_id"], **resync_fields)
          '''
          if old not in p:
              raise SystemExit('pipeline call anchor not found')
          p = p.replace(old, new, 1)

          old = '''# detected to have polluted them with a disagreeing transient value (#257
          # independent-review round 2) — the only write this reconciliation performs.
          '''
          new = '''# detected to have polluted them with a disagreeing transient value (#257
          # independent-review round 2) — through a narrow private Canon-repair path;
          # public update_fact()/store_fact() claim-identity locking remains unchanged.
          '''
          if old not in p:
              raise SystemExit('pipeline comment anchor not found')
          p = p.replace(old, new, 1)
          pipeline.write_text(p)

          c = ci.read_text()
          temporary_job = '''
            source-snapshot:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Upload reconciliation source files
                  uses: actions/upload-artifact@v4
                  with:
                    name: reconciliation-source-snapshot
                    path: |
                      core/memory.py
                      core/pipeline.py
          '''
          if temporary_job not in c:
              raise SystemExit('temporary source-snapshot job not found')
          ci.write_text(c.replace(temporary_job, '\n', 1))

          Path('.github/workflows/reconcile-repair.yml').unlink()
          PY

      - name: Verify syntax and focused regression tests
        run: |
          python -m py_compile core/memory.py core/pipeline.py
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          pytest -q \
            tests/test_pipeline.py::test_recall_uses_l3_record_claim_and_source_not_transient_item \
            tests/test_pipeline.py::test_recall_reconciliation_syncs_trace_source_not_just_epistemic_state \
            tests/test_pipeline.py::test_recall_reconciliation_resyncs_l1_claim_and_source_after_pollution

      - name: Commit verified repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: reconcile canonical repair with claim identity"
          git push origin HEAD:agent/optimize-sqlite-vector-search
