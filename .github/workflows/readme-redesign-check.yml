name: Temporary README redesign validation

on:
  push:
    branches:
      - agent/crystal-grant-readme-redesign

permissions:
  contents: write

jobs:
  validate-and-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crystal-grant-readme-redesign
      - name: Repair and validate README links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          from urllib.parse import unquote

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'See the full [Quickstart](./docs/QUICKSTART.md) and reproducible\n[Reviewer Demo](./docs/REVIEWER_DEMO.md).',
              'See the reproducible [Reviewer Demo](./docs/REVIEWER_DEMO.md) and\n[CLI demonstration](./docs/DEMO.md).',
          )
          path.write_text(text, encoding='utf-8')

          errors = []
          pattern = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          for target in pattern.findall(text):
              target = target.strip().split()[0].strip('<>')
              if target.startswith(('http://', 'https://', '#', 'mailto:')):
                  continue
              clean = unquote(target.split('#', 1)[0].split('?', 1)[0])
              if not clean:
                  continue
              resolved = (path.parent / clean).resolve()
              try:
                  resolved.relative_to(Path.cwd().resolve())
              except ValueError:
                  errors.append(f'link escapes repository: {target}')
                  continue
              if not resolved.exists():
                  errors.append(f'broken local link: {target}')

          if errors:
              print('README validation failed:')
              for error in errors:
                  print(f'  - {error}')
              sys.exit(1)
          print('README local-link validation passed')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs(readme): repair and validate reviewer links'
          git push origin HEAD:agent/crystal-grant-readme-redesign
