name: i18n integrity

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  i18n-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate localization structure, selectors and links
        run: python scripts/check_i18n.py
