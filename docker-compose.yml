# Velantrim ExoCortex — Crystal: local-first, fail-closed API deployment (Track 2).
#
# Usage:
#   export VELANTRIM_API_TOKEN=$(python -c "import secrets;print(secrets.token_urlsafe(32))")
#   docker compose up --build
#
# Without VELANTRIM_API_TOKEN set, `docker compose up` fails fast (see the
# `:?` interpolation below) — the service is never started unprotected.
#
# Security boundary: the API is published ONLY on host loopback
# (127.0.0.1:8000). Public exposure must be an explicit, separate decision
# (override file + reverse proxy + TLS), never the default.

services:
  velantrim-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: velantrim-exocortex-crystal:local
    # Fail fast on the HOST before the container even starts if the operator
    # has not provided a token. No baked-in fallback token by design.
    environment:
      VELANTRIM_API_TOKEN: "${VELANTRIM_API_TOKEN:?Set VELANTRIM_API_TOKEN before running}"
      # 0.0.0.0 INSIDE the container so the published port can reach uvicorn.
      # The loopback restriction lives on the host port mapping below.
      VELANTRIM_API_HOST: "0.0.0.0"
      VELANTRIM_API_PORT: "8000"
      VELANTRIM_DB: "/app/data/velantrim_memory.db"
    # Reachable only from the host's loopback interface — not the LAN/internet.
    ports:
      - "127.0.0.1:8000:8000"
    # Persistent local-first store. A NAMED VOLUME is the default so `docker
    # compose up` works out-of-the-box with the non-root `velantrim` user:
    # Docker initializes a named volume with the image directory's ownership, so
    # there are no first-run SQLite permission errors. The data stays local
    # (never leaves the machine) and is inspectable/exportable via `docker volume`.
    #
    # Power-user alternative — repo-visible files under ./data — replace the line
    # below with a bind mount, but you MUST pre-create it writable by uid 1000:
    #   mkdir -p data && chown 1000:1000 data
    #   - ./data:/app/data
    volumes:
      - velantrim-data:/app/data
    restart: unless-stopped

# Named volumes are local Docker-managed persistence (still local-first):
#   docker volume inspect velantrim-exocortex-crystal_velantrim-data
volumes:
  velantrim-data:
