[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velantrim-exocortex-crystal"
version = "0.3.0"
description = "Verifiable, local-first memory infrastructure for trustworthy AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Velantrian" }]
keywords = ["memory", "knowledge-graph", "provenance", "gdpr", "ai", "local-first"]
dependencies = []

[project.urls]
Homepage = "https://github.com/velantrian/velantrim-exocortex-crystal"
Repository = "https://github.com/velantrian/velantrim-exocortex-crystal"

# The CLI entry point: `velantrim <command>` after `pip install .`.
[project.scripts]
velantrim = "core.cli:main"
velantrim-mcp = "core.mcp_server:main"
velantrim-api = "core.api:main"

[project.optional-dependencies]
# Development/test environment. MUST stay aligned with requirements-dev.txt
# (the file CI installs): `pip install -e '.[dev]'` and
# `pip install -r requirements-dev.txt` are the same documented path, and the
# full suite (100% coverage gate) needs every optional layer below.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    # optional layers exercised by the test suite (NOT runtime deps):
    "fastapi>=0.110.0",       # core/api.py service layer tests
    "httpx>=0.27.0",          # FastAPI test client
    "cryptography>=42.0.0",   # core/crypto.py Fernet backend (GDPR Art. 32)
    "pyyaml>=6.0",            # core/adapters yaml adapter (WP4)
    "pypdf>=4.0",             # core/adapters pdf adapter (WP4)
    "rdflib>=7.0",            # core/adapters rdf adapter (WP4)
    "ebooklib>=0.18",         # core/adapters epub adapter (WP4)
    "requests>=2.28",         # core/adapters wikidata adapter (WP4)
]
# L3 canonical graph backend. Default mode 'auto' uses LadybugDB when installed
# (recommended production engine, Kuzu successor) and falls back to the
# dependency-free in-memory mock otherwise.
ladybug = [
    "ladybug>=0.17.0",
]
# Optional alternative L3 backend (server-based). Select with
# VELANTRIM_L3_BACKEND=neo4j + NEO4J_URI/NEO4J_USER/NEO4J_PASSWORD.
neo4j = [
    "neo4j>=5.0.0",
]
# Real neural embeddings for semantic retrieval (VELANTRIM_EMBEDDER=sbert).
# Optional: the default embedder is the dependency-free HashingEmbedder.
embeddings = [
    "sentence-transformers>=2.2.0",
]
# LLM answer generation via Claude (VELANTRIM_GENERATOR=anthropic).
# Optional: the default generator is the dependency-free ExtractiveGenerator.
llm = [
    "anthropic>=0.40.0",
]
# Encryption at rest (GDPR Art. 32). Enables the Fernet (AES) backend for
# core/crypto.py when VELANTRIM_ENCRYPTION_KEY is set. Optional: without it, a
# dependency-free authenticated HMAC-SHA256 backend is used instead.
encryption = [
    "cryptography>=42.0.0",
]
# Shared L3 re-merge queue across workers (VELANTRIM_QUEUE_BACKEND=redis, or
# auto when a server is reachable). Optional: the default is the persistent,
# dependency-free SQLite outbox.
redis = [
    "redis>=5.0.0",
]
# HTTP service layer (FastAPI). Run with `velantrim-api` after install, or embed
# core.api:create_app() in your own ASGI server. Optional: the default surfaces
# are the CLI (`velantrim`) and the read-only MCP server, both stdlib-only.
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
# ── WP4 knowledge adapters ─────────────────────────────────────────────────────
# Each adapter extends `velantrim learn` to a new file type while keeping the
# stdlib-only runtime untouched. Adapters are auto-loaded on demand; an
# ImportError with an install hint is raised if the dep is missing.
yaml = [
    "pyyaml>=6.0",
]
pdf = [
    "pypdf>=4.0",
]
rdf = [
    "rdflib>=7.0",
]
epub = [
    "ebooklib>=0.18",
]
wikidata = [
    "requests>=2.28",
]
# Convenience meta-extra: all WP4 adapters at once.
adapters = [
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "rdflib>=7.0",
    "ebooklib>=0.18",
    "requests>=2.28",
]

# Explicit package surface — the runtime is the `core` package plus the
# top-level `adaptive_threshold_module` it imports. Declaring them keeps the
# flat-layout build reproducible (no auto-discovery ambiguity over prototypes/
# utils/docs, which are not part of the installable runtime).
[tool.setuptools]
packages = ["core", "core.adapters"]
py-modules = ["adaptive_threshold_module"]

[tool.setuptools.package-data]
# Bundle the curated evaluation fixtures (WP3) and the MOSC classifier weights
# so `velantrim eval` / ingest classification work from a wheel as well as the
# repo.
core = ["_eval_fixtures/*.json", "_mosc/*.json", "_webui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]