[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velantrim-exocortex-crystal"
version = "0.1.0-mvp"
description = "Long-term memory system for AI agents — MVP + full spec"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Velantrian" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
# L3 canonical graph backend. Default mode 'auto' uses LadybugDB when installed
# (recommended production engine, Kuzu successor) and falls back to the
# dependency-free in-memory mock otherwise.
ladybug = [
    "ladybug>=0.17.0",
]
# Optional alternative L3 backend (server-based). Select with
# VELANTRIM_L3_BACKEND=neo4j + NEO4J_URI/NEO4J_USER/NEO4J_PASSWORD.
neo4j = [
    "neo4j>=5.0.0",
]
# Real neural embeddings for semantic retrieval (VELANTRIM_EMBEDDER=sbert).
# Optional: the default embedder is the dependency-free HashingEmbedder.
embeddings = [
    "sentence-transformers>=2.2.0",
]
# LLM answer generation via Claude (VELANTRIM_GENERATOR=anthropic).
# Optional: the default generator is the dependency-free ExtractiveGenerator.
llm = [
    "anthropic>=0.40.0",
]
# Encryption at rest (GDPR Art. 32). Enables the Fernet (AES) backend for
# core/crypto.py when VELANTRIM_ENCRYPTION_KEY is set. Optional: without it, a
# dependency-free authenticated HMAC-SHA256 backend is used instead.
encryption = [
    "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
