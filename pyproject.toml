[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velantrim-exocortex-crystal"
version = "0.1.0"
description = "Verifiable, local-first memory infrastructure for trustworthy AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Velantrian" }]
keywords = ["memory", "knowledge-graph", "provenance", "gdpr", "ai", "local-first"]
dependencies = []

[project.urls]
Homepage = "https://github.com/velantrian/velantrim-exocortex-crystal"
Repository = "https://github.com/velantrian/velantrim-exocortex-crystal"

# The CLI entry point: `velantrim <command>` after `pip install .`.
[project.scripts]
velantrim = "core.cli:main"
velantrim-mcp = "core.mcp_server:main"
velantrim-api = "core.api:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
# L3 canonical graph backend. Default mode 'auto' uses LadybugDB when installed
# (recommended production engine, Kuzu successor) and falls back to the
# dependency-free in-memory mock otherwise.
ladybug = [
    "ladybug>=0.17.0",
]
# Optional alternative L3 backend (server-based). Select with
# VELANTRIM_L3_BACKEND=neo4j + NEO4J_URI/NEO4J_USER/NEO4J_PASSWORD.
neo4j = [
    "neo4j>=5.0.0",
]
# Real neural embeddings for semantic retrieval (VELANTRIM_EMBEDDER=sbert).
# Optional: the default embedder is the dependency-free HashingEmbedder.
embeddings = [
    "sentence-transformers>=2.2.0",
]
# LLM answer generation via Claude (VELANTRIM_GENERATOR=anthropic).
# Optional: the default generator is the dependency-free ExtractiveGenerator.
llm = [
    "anthropic>=0.40.0",
]
# Encryption at rest (GDPR Art. 32). Enables the Fernet (AES) backend for
# core/crypto.py when VELANTRIM_ENCRYPTION_KEY is set. Optional: without it, a
# dependency-free authenticated HMAC-SHA256 backend is used instead.
encryption = [
    "cryptography>=42.0.0",
]
# Shared L3 re-merge queue across workers (VELANTRIM_QUEUE_BACKEND=redis, or
# auto when a server is reachable). Optional: the default is the persistent,
# dependency-free SQLite outbox.
redis = [
    "redis>=5.0.0",
]
# HTTP service layer (FastAPI). Run with `velantrim-api` after install, or embed
# core.api:create_app() in your own ASGI server. Optional: the default surfaces
# are the CLI (`velantrim`) and the read-only MCP server, both stdlib-only.
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

# Explicit package surface — the runtime is the `core` package plus the
# top-level `epigenetic_adaptation_module` it imports. Declaring them keeps the
# flat-layout build reproducible (no auto-discovery ambiguity over prototypes/
# utils/docs, which are not part of the installable runtime).
[tool.setuptools]
packages = ["core"]
py-modules = ["epigenetic_adaptation_module"]

[tool.setuptools.package-data]
# Bundle the curated evaluation fixtures (WP3) so `velantrim eval` works from a
# wheel as well as the repo.
core = ["_eval_fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
